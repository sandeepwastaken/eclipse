<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Compare lunar landing sites and dates: terrain-corrected Sun and Earth visibility from NASA/JPL DE440 and LRO LOLA data." />
    <link rel="icon" type="image/svg+xml" href="./assets/moon-logo.svg" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <title>Eclipse Landing Site Navigator NSA 26</title>
  </head>
  <body>
    <!-- Shown until the app's own loader takes over: the logo Moon, gently pulsing. -->
    <div id="root"><div style="position:fixed;inset:0;display:grid;place-items:center;background:#000"><img src="./assets/moon-logo.svg" width="76" height="76" alt="" style="border-radius:50%;outline:1.5px solid #fff;outline-offset:2px;animation:boot 1.8s ease-in-out infinite" /></div></div>
    <style>@keyframes boot{50%{opacity:.45;transform:scale(.96)}}@media (prefers-reduced-motion:reduce){img{animation:none!important}}</style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
